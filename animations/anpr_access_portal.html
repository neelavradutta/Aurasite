<html>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Courier New', monospace;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
    min-height: 100vh;
    overflow: hidden;
  }

  .container {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    top: 0;
    left: 0;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #00ffff;
    border-radius: 50%;
    opacity: 0.3;
    animation: twinkle 3s infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  .grid-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(0deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    opacity: 0.5;
  }

  .card {
    position: relative;
    z-index: 10;
    background: rgba(10, 30, 70, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 255, 255, 0.3);
    border-radius: 20px;
    padding: 60px 50px;
    width: 100%;
    max-width: 450px;
    box-shadow: 
      0 0 20px rgba(0, 255, 255, 0.1),
      inset 0 0 20px rgba(0, 255, 255, 0.05);
    animation: slideIn 0.8s ease-out;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .title {
    font-size: 32px;
    font-weight: bold;
    color: #00ffff;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    letter-spacing: 2px;
    animation: titleGlow 2s ease-in-out infinite;
  }

  @keyframes titleGlow {
    0%, 100% {
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      color: #00ffff;
    }
    50% {
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
      color: #00ffdd;
    }
  }

  .subtitle {
    font-size: 14px;
    color: rgba(100, 200, 255, 0.7);
    margin-bottom: 35px;
    letter-spacing: 1px;
  }

  .form-group {
    margin-bottom: 20px;
    animation: fadeInUp 0.6s ease-out forwards;
    opacity: 0;
  }

  .form-group:nth-child(2) { animation-delay: 0.1s; }
  .form-group:nth-child(3) { animation-delay: 0.2s; }
  .form-group:nth-child(4) { animation-delay: 0.3s; }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  label {
    display: block;
    font-size: 12px;
    color: #64c8ff;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(15, 45, 100, 0.4);
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 8px;
    color: #00ffff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    transition: all 0.3s ease;
    outline: none;
    letter-spacing: 0.5px;
  }

  input::placeholder {
    color: rgba(0, 255, 255, 0.3);
  }

  input:focus {
    background: rgba(15, 45, 100, 0.6);
    border: 1px solid rgba(0, 255, 255, 0.6);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.05);
  }

  input:hover {
    border: 1px solid rgba(0, 255, 255, 0.4);
    background: rgba(15, 45, 100, 0.5);
  }

  .button {
    width: 100%;
    padding: 14px;
    background: rgba(0, 255, 255, 0.1);
    border: 1px solid rgba(0, 255, 255, 0.5);
    color: #00ffff;
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Courier New', monospace;
    margin-top: 30px;
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.6s ease-out 0.4s forwards;
    opacity: 0;
  }

  .button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }

  .button:hover {
    background: rgba(0, 255, 255, 0.2);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.1);
    border: 1px solid rgba(0, 255, 255, 0.8);
  }

  .button:hover::before {
    left: 100%;
  }

  .button:active {
    transform: scale(0.98);
  }

  .toggle-text {
    text-align: center;
    margin-top: 25px;
    font-size: 13px;
    color: rgba(100, 200, 255, 0.6);
    animation: fadeInUp 0.6s ease-out 0.5s forwards;
    opacity: 0;
  }

  .toggle-link {
    color: #00ffff;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    font-weight: bold;
  }

  .toggle-link:hover {
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
    color: #00ffdd;
  }

  .error {
    color: #ff0055;
    font-size: 12px;
    margin-top: 5px;
    opacity: 0;
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); opacity: 1; }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .orbit {
    position: absolute;
    width: 300px;
    height: 300px;
    border: 1px solid rgba(0, 255, 255, 0.1);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .orbit-1 { animation: rotate 20s linear infinite; }
  .orbit-2 { animation: rotate 25s linear infinite reverse; width: 200px; height: 200px; }
  .orbit-3 { animation: rotate 30s linear infinite; width: 400px; height: 400px; }

  @keyframes rotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #00ffff;
    border-radius: 50%;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) opacity(1); }
    50% { transform: translate(20px, -20px); opacity: 0.5); }
  }
</style>

<div class="container">
  <div class="stars" id="stars"></div>
  <div class="grid-bg"></div>
  
  <div class="orbit orbit-1"></div>
  <div class="orbit orbit-2"></div>
  <div class="orbit orbit-3"></div>

  <div class="card" id="card">
    <div class="title">ANPR ACCESS</div>
    <div class="subtitle" id="subtitle">Sign in to manage detections and exports</div>

    <div id="form-container">
      <div class="form-group" id="name-group" style="display: none;">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Full name">
        <div class="error" id="name-error"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@anpr.local">
        <div class="error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <div class="error" id="password-error"></div>
      </div>

      <button class="button" id="submit-btn">Sign In</button>

      <div class="toggle-text">
        Need an account? <span class="toggle-link" id="toggle">Register</span>
      </div>
    </div>
  </div>
</div>

<script>
  // Create stars
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
  }

  // Create particles
  const container = document.querySelector('.container');
  for (let i = 0; i < 10; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 4 + 's';
    container.appendChild(particle);
  }

  let isLogin = true;

  const nameGroup = document.getElementById('name-group');
  const subtitle = document.getElementById('subtitle');
  const submitBtn = document.getElementById('submit-btn');
  const toggleLink = document.getElementById('toggle');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const nameInput = document.getElementById('name');

  toggleLink.addEventListener('click', () => {
    isLogin = !isLogin;
    
    nameGroup.style.display = isLogin ? 'none' : 'block';
    subtitle.textContent = isLogin 
      ? 'Sign in to manage detections and exports' 
      : 'Create an operator account';
    submitBtn.textContent = isLogin ? 'Sign In' : 'Register';
    toggleLink.textContent = isLogin ? 'Register' : 'Sign in';
    
    // Reset form
    document.querySelectorAll('input').forEach(input => input.value = '');
    document.querySelectorAll('.error').forEach(error => error.textContent = '');
  });

  submitBtn.addEventListener('click', () => {
    let isValid = true;
    
    document.querySelectorAll('.error').forEach(error => error.textContent = '');

    if (!isLogin && !nameInput.value.trim()) {
      document.getElementById('name-error').textContent = 'Name is required';
      isValid = false;
    }

    if (!emailInput.value.includes('@')) {
      document.getElementById('email-error').textContent = 'Valid email required';
      isValid = false;
    }

    if (passwordInput.value.length < 6) {
      document.getElementById('password-error').textContent = 'Password must be at least 6 characters';
      isValid = false;
    }

    if (isValid) {
      submitBtn.style.background = 'rgba(0, 255, 100, 0.3)';
      submitBtn.style.borderColor = 'rgba(0, 255, 100, 0.8)';
      submitBtn.textContent = '✓ Success';
      setTimeout(() => {
        submitBtn.style.background = 'rgba(0, 255, 255, 0.1)';
        submitBtn.style.borderColor = 'rgba(0, 255, 255, 0.5)';
        submitBtn.textContent = isLogin ? 'Sign In' : 'Register';
      }, 2000);
    }
  });

  // Add input focus glow effect
  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', (e) => {
      e.target.style.boxShadow = '0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1)';
    });
    input.addEventListener('blur', (e) => {
      e.target.style.boxShadow = 'none';
    });
  });
</script>
</html>
