<div style="background: #0a0e27; color: #fff; padding: 2rem; border-radius: 12px; font-family: 'Courier New', monospace; min-height: 600px; position: relative; overflow: hidden;">

  <style>
    @keyframes drawLine {
      from {
        stroke-dashoffset: 1000;
      }
      to {
        stroke-dashoffset: 0;
      }
    }
    
    @keyframes fillFromBottom {
      from {
        opacity: 0;
        transform: scaleY(0);
      }
      to {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    @keyframes fadeInLabel {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 350px;
      margin-bottom: 2rem;
      background: linear-gradient(to bottom, rgba(139, 0, 139, 0.05), rgba(25, 0, 51, 0.1));
      border: 1px solid rgba(255, 0, 128, 0.2);
      border-radius: 8px;
      overflow: visible;
    }

    .peak-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
    }

    .peak-line.animate {
      animation: drawLine 2.5s ease-out forwards !important;
    }

    .peak-fill {
      transform-origin: bottom;
      transform: scaleY(0);
    }

    .peak-fill.animate {
      animation: fillFromBottom 2s ease-out 2.5s forwards !important;
    }

    .data-point {
    }

    .data-point.animate {
      animation: pulse 2s ease-in-out 2.5s infinite !important;
    }

    .data-label {
      font-size: 10px;
      font-weight: bold;
      fill: #ff0080;
      opacity: 0;
    }

    .label-box {
      fill: rgba(10, 14, 39, 0.95);
      stroke: rgba(255, 0, 128, 0.5);
      stroke-width: 0.5;
      rx: 2;
      opacity: 0;
    }

    /* Individual delays for each point label (0-2.5s across 16 points) */
    .label-1 { animation: fadeInLabel 0.2s ease-out 0.156s forwards !important; }
    .label-2 { animation: fadeInLabel 0.2s ease-out 0.312s forwards !important; }
    .label-3 { animation: fadeInLabel 0.2s ease-out 0.468s forwards !important; }
    .label-4 { animation: fadeInLabel 0.2s ease-out 0.625s forwards !important; }
    .label-5 { animation: fadeInLabel 0.2s ease-out 0.781s forwards !important; }
    .label-6 { animation: fadeInLabel 0.2s ease-out 0.937s forwards !important; }
    .label-7 { animation: fadeInLabel 0.2s ease-out 1.093s forwards !important; }
    .label-8 { animation: fadeInLabel 0.2s ease-out 1.25s forwards !important; }
    .label-9 { animation: fadeInLabel 0.2s ease-out 1.406s forwards !important; }
    .label-10 { animation: fadeInLabel 0.2s ease-out 1.562s forwards !important; }
    .label-11 { animation: fadeInLabel 0.2s ease-out 1.718s forwards !important; }
    .label-12 { animation: fadeInLabel 0.2s ease-out 1.875s forwards !important; }
    .label-13 { animation: fadeInLabel 0.2s ease-out 2.031s forwards !important; }
    .label-14 { animation: fadeInLabel 0.2s ease-out 2.187s forwards !important; }
    .label-15 { animation: fadeInLabel 0.2s ease-out 2.343s forwards !important; }
    .label-16 { animation: fadeInLabel 0.2s ease-out 2.5s forwards !important; }

    .control-panel {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      border: 1px solid rgba(255, 0, 128, 0.5);
      color: #ff0080;
      padding: 8px 20px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: rgba(255, 0, 128, 0.15);
      border-color: #ff0080;
      box-shadow: 0 0 8px rgba(255, 0, 128, 0.2);
    }

    button:active {
      transform: scale(0.98);
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #ff0080;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 12px;
      color: rgba(255, 0, 128, 0.5);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    svg {
      width: 100%;
      height: 100%;
    }
  </style>

  <div class="control-panel">
    <button onclick="restartAnimation()">▶ Restart Animation</button>
    <button onclick="alert('Data export feature - coming soon')">⬇ Export Data</button>
    <button onclick="alert('Analysis mode enabled')">⚙ Analyze</button>
  </div>

  <script>
    function restartAnimation() {
      const peakLine = document.getElementById('peakLine');
      const peakFill = document.getElementById('peakFill');
      const dataPoints = document.getElementById('dataPoints');
      
      // Cancel all running animations
      peakLine.getAnimations().forEach(anim => anim.cancel());
      peakFill.getAnimations().forEach(anim => anim.cancel());
      dataPoints.getAnimations().forEach(anim => anim.cancel());
      
      // Reset styles
      peakLine.style.animation = 'none';
      peakFill.style.animation = 'none';
      dataPoints.style.animation = 'none';
      
      peakLine.classList.remove('animate');
      peakFill.classList.remove('animate');
      dataPoints.classList.remove('animate');
      
      // Force reflow
      void peakLine.offsetWidth;
      void peakFill.offsetWidth;
      void dataPoints.offsetWidth;
      
      // Restart animations
      setTimeout(() => {
        peakLine.classList.add('animate');
        peakFill.classList.add('animate');
        dataPoints.classList.add('animate');
      }, 50);
    }
    
    // Start animation on load
    window.addEventListener('load', () => {
      restartAnimation();
    });
  </script>
</div>
