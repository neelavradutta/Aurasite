<script>
const sampleVehicles = [
  { plate: 'DL-01', speed: 45 },
  { plate: 'MH-02', speed: 82 },
  { plate: 'KA-03', speed: 28 },
  { plate: 'TN-04', speed: 95 },
  { plate: 'GJ-05', speed: 62 },
  { plate: 'RJ-06', speed: 38 },
  { plate: 'PB-07', speed: 78 },
  { plate: 'HR-08', speed: 55 },
  { plate: 'UP-09', speed: 89 },
  { plate: 'WB-10', speed: 42 }
];

let data1 = [], data2 = [], data3 = [];

// DESIGN 1
function design1Add() {
  const p = document.getElementById('d1Plate').value.trim();
  const s = parseInt(document.getElementById('d1Speed').value);
  if (p && s >= 0 && s <= 120) {
    data1.push({plate: p, speed: s});
    document.getElementById('d1Plate').value = '';
    document.getElementById('d1Speed').value = '';
  }
}

function design1Sample() {
  data1 = [...sampleVehicles];
  design1Plot();
}

function design1Plot() {
  if (data1.length < 2) return;
  const svg = document.getElementById('design1Svg');
  const display = document.getElementById('d1Data');
  svg.innerHTML = '<defs><linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#fff;stop-opacity:0.4" /><stop offset="100%" style="stop-color:#fff;stop-opacity:0" /></linearGradient></defs>';
  display.innerHTML = '';
  
  const points = data1.map((v, i) => ({
    x: 50 + (i / (data1.length - 1)) * 900,
    y: 250 - (v.speed / 120) * 200,
    plate: v.plate,
    speed: v.speed
  }));
  
  let pathD = 'M ' + points[0].x + ' ' + points[0].y;
  for (let i = 1; i < points.length; i++) {
    pathD += ' L ' + points[i].x + ' ' + points[i].y;
  }
  pathD += ' L ' + points[points.length-1].x + ' 300 L 50 300 Z';
  
  const area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  area.setAttribute('d', pathD);
  area.setAttribute('fill', 'url(#grad1)');
  area.setAttribute('stroke', 'none');
  svg.appendChild(area);
  
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  line.setAttribute('d', pathD.replace(' L ' + points[points.length-1].x + ' 300 L 50 300 Z', ''));
  line.setAttribute('stroke', '#fff');
  line.setAttribute('stroke-width', '3');
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(line);
  
  let idx = 0;
  const int = setInterval(() => {
    if (idx >= points.length) { clearInterval(int); return; }
    const p = points[idx];
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x);
    c.setAttribute('cy', p.y);
    c.setAttribute('r', '5');
    c.setAttribute('fill', '#fff');
    c.setAttribute('stroke', 'rgba(255,255,255,0.3)');
    c.setAttribute('stroke-width', '3');
    svg.appendChild(c);
    
    const tag = document.createElement('div');
    tag.style.background = '#fff';
    tag.style.color = '#667eea';
    tag.style.padding = '4px 10px';
    tag.style.borderRadius = '4px';
    tag.style.fontSize = '10px';
    tag.style.fontWeight = '700';
    tag.style.fontFamily = 'monospace';
    tag.textContent = p.plate + '/' + p.speed;
    display.appendChild(tag);
    idx++;
  }, 100);
}
