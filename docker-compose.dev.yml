services:
  mysql:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      FASTAPI_ENV: development
      LOG_LEVEL: DEBUG
      GPU_ENABLED: "false"
    volumes:
      - ./ai-service:/app
      - ai_models:/app/models
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --reload

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
