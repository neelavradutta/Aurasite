services:
  mysql:
    image: mysql:8.0
    container_name: anpr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: anpr_db
      MYSQL_USER: anpr_user
      MYSQL_PASSWORD: anpr_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anpr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: anpr-ai-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FASTAPI_ENV: production
      LOG_LEVEL: INFO
      GPU_ENABLED: "false"
      PORT: 5000
      BACKEND_CALLBACK_URL: http://backend:8000
    volumes:
      - ai_models:/app/models
      - uploads:/app/uploads
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: anpr-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://anpr_user:anpr_pass@mysql:3306/anpr_db
      REDIS_URL: redis://redis:6379
      PYTHON_SERVICE_URL: http://ai-service:5000
      JWT_SECRET: change-me-in-production
      PORT: 8000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anpr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads:
  ai_models:

networks:
  default:
    name: anpr-network
