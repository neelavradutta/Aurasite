<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512">
  <title>AURASITE Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #050510;
    }
    canvas {
      display: block;
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
  <canvas id="animationCanvas" width="512" height="512"></canvas>
  <script>
    const SIZE = 512;
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = Math.max(2, window.devicePixelRatio || 1);
    canvas.width = SIZE * dpr;
    canvas.height = SIZE * dpr;
    ctx.scale(dpr, dpr);

    let time = 0;
    const particles = [];
    const circuits = [];
    const cx = SIZE / 2;
    const cy = SIZE / 2;

    function createCircuits() {
      circuits.length = 0;
      for (let i = 0; i < 18; i++) {
        let x = Math.random() * SIZE;
        let y = Math.random() * SIZE;
        const points = [{ x, y }];
        const segments = 3 + Math.floor(Math.random() * 3);
        for (let j = 0; j < segments; j++) {
          const horizontal = Math.random() > 0.5;
          const length = (Math.random() - 0.5) * 120;
          if (horizontal) x += length;
          else y += length;
          points.push({ x, y });
        }
        circuits.push({
          points,
          alpha: 0.03 + Math.random() * 0.08,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
    createCircuits();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        const angle = Math.random() * Math.PI * 2;
        const r = 100 + Math.random() * 40;
        this.x = cx + Math.cos(angle) * r;
        this.y = cy + Math.sin(angle) * r;
        this.vx = Math.cos(angle) * (0.8 + Math.random() * 2.2);
        this.vy = Math.sin(angle) * (0.8 + Math.random() * 2.2) - 0.15;
        this.size = 2.5 + Math.random() * 4.5;
        this.alpha = 1;
        this.life = 0.006 + Math.random() * 0.012;
        this.color = Math.random() > 0.4 ? '#00f3ff' : '#00ffaa';
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.life;
        if (this.alpha <= 0) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.shadowBlur = 18;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function drawA(scale) {
      ctx.beginPath();
      ctx.moveTo(cx - 50 * scale, cy + 60 * scale);
      ctx.bezierCurveTo(cx - 90 * scale, cy + 20 * scale, cx - 40 * scale, cy - 80 * scale, cx, cy - 75 * scale);
      ctx.bezierCurveTo(cx + 30 * scale, cy - 70 * scale, cx + 55 * scale, cy + 20 * scale, cx + 30 * scale, cy + 65 * scale);
      ctx.moveTo(cx - 40 * scale, cy + 15 * scale);
      ctx.quadraticCurveTo(cx + 10 * scale, cy - 10 * scale, cx + 45 * scale, cy - 35 * scale);
      ctx.moveTo(cx - 20 * scale, cy + 30 * scale);
      ctx.quadraticCurveTo(cx + 20 * scale, cy + 5 * scale, cx + 35 * scale, cy - 10 * scale);
      ctx.stroke();
    }

    function renderFrame() {
      time += 0.03;

      const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, SIZE * 0.72);
      bgGrad.addColorStop(0, '#0d1330');
      bgGrad.addColorStop(0.5, '#070814');
      bgGrad.addColorStop(1, '#11051c');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, SIZE, SIZE);

      ctx.lineWidth = 1.5;
      circuits.forEach((c) => {
        const pulseAlpha = c.alpha * (1 + 0.4 * Math.sin(time * 2 + c.phase));
        ctx.strokeStyle = `rgba(0, 180, 255, ${pulseAlpha})`;
        ctx.beginPath();
        ctx.moveTo(c.points[0].x, c.points[0].y);
        for (let i = 1; i < c.points.length; i++) ctx.lineTo(c.points[i].x, c.points[i].y);
        ctx.stroke();
      });

      ctx.globalCompositeOperation = 'screen';
      particles.forEach((p) => { p.update(); p.draw(); });

      const grad = ctx.createLinearGradient(cx - 130, cy - 130, cx + 130, cy + 130);
      grad.addColorStop(0, '#00ffaa');
      grad.addColorStop(0.4, '#00f3ff');
      grad.addColorStop(1, '#0044ff');

      const passes = [
        { blur: 45, opacity: 0.25, width: 14 },
        { blur: 20, opacity: 0.45, width: 8 },
        { blur: 8, opacity: 0.75, width: 4 },
        { blur: 2, opacity: 1.0, width: 2 },
      ];
      const pulseIntensity = 1 + 0.05 * Math.sin(time * 2.5);

      passes.forEach((pass) => {
        ctx.save();
        ctx.strokeStyle = grad;
        ctx.globalAlpha = pass.opacity;
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = pass.blur * pulseIntensity;
        ctx.lineWidth = (pass.width + 2) * 1.1;
        ctx.beginPath();
        ctx.arc(cx, cy, 125, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = pass.width * 0.6;
        ctx.beginPath();
        ctx.arc(cx, cy, 112, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = pass.width * 1.3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        drawA(pulseIntensity);
        ctx.restore();
      });

      ctx.globalCompositeOperation = 'source-over';
    }

    // Snapshot mode for PNG export; otherwise animate continuously.
    const snapshotMode = new URLSearchParams(window.location.search).get('snapshot') === '1';
    if (snapshotMode) {
      for (let i = 0; i < 40; i++) renderFrame();
      window.__ICON_READY__ = true;
    } else {
      function animate() {
        renderFrame();
        requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>
